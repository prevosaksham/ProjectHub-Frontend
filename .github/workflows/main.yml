name: Deploy ProjectHub Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to UAT
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H ${{ secrets.GCP_VM_HOST }} >> ~/.ssh/known_hosts

          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} << 'EOF'

            set -e

            echo "🚀 Starting ProjectHub Frontend Deploy"

            cd /var/www/project-hub/frontend

            echo "📥 Pulling latest code..."
            sudo git fetch origin
            sudo git reset --hard origin/main

            echo "📦 Installing dependencies..."
            sudo npm install

            echo "🧹 Cleaning old build..."
            sudo rm -rf dist

            echo "🏗️ Building frontend..."
            sudo npm run build

            echo "🔐 Setting permissions..."
            sudo chmod -R 755 dist/

            echo "✅ ProjectHub Frontend Deployment Completed"

          EOF
