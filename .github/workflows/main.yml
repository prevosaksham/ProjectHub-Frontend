name: Deploy ProjectHub Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: CI=false npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H ${{ secrets.GCP_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare Server
        run: |
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} << 'EOF'
            sudo rm -rf /var/www/project-hub/frontend/dist/*
            mkdir -p /tmp/projecthub-dist
          EOF

      - name: Upload Dist Files
        run: |
          scp -r dist/* \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}:/tmp/projecthub-dist/

      - name: Move Dist to Production
        run: |
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} << 'EOF'

            sudo cp -r /tmp/projecthub-dist/* /var/www/project-hub/frontend/dist/

            sudo chmod -R 755 /var/www/project-hub/frontend/dist/

            rm -rf /tmp/projecthub-dist

            echo "✅ ProjectHub frontend deployment completed"

          EOF
